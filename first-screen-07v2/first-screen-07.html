<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>first-screen-07</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/first-screen-07.css" />
  </head>
  <body>
    <section class="first-screen-07">
      <div class="first-screen-07__wrapper">
        <figure class="first-screen-07__photo">
          <img
            class="first-screen-07__photo-image first-screen-07__photo-image_desktop"
            src="./assets/images/first-screen-07/first-screen-07-photo-desktop.webp"
            alt="photo"
          />
          <img
            class="first-screen-07__photo-image first-screen-07__photo-image_mobile"
            src="./assets/images/first-screen-07/first-screen-07-photo-mobile.webp"

        </figure>

        <div class="first-screen-07__content">
          <h1 class="first-screen-07__title">ГРУЗОПЕРЕВОЗКИ</h1>
          <p class="first-screen-07__description">ВСЕМИ ВИДАМИ ТРАНСПОРТА</p>

        <div class="first-screen-07__menu">
          <a class="first-screen-07__menu-link first-screen-07__menu-link_train" href="#">
            Перевозки <br />

          </a>
          <a class="first-screen-07__menu-link first-screen-07__menu-link_avia" href="#">
            Авиаперевозки грузов
          </a>
          <a class="first-screen-07__menu-link first-screen-07__menu-link_auto" href="#">
            Автомобильные перевозки
          </a>
          <a class="first-screen-07__menu-link first-screen-07__menu-link_ship" href="#">

          </a>

      </div>
